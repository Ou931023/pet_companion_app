name: Deploy legal site to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - store_legal_site/**
      - .github/workflows/legal-site-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: legal-site-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload legal site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: store_legal_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
