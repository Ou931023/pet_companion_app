version: "3.8"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: pet_companion_db
    environment:
      POSTGRES_DB: love_companion
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d love_companion"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
