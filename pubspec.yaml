name: pet_companion_app
description: Ai companion pet demo for elderly care interactions.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  flutter_tts: ^4.0.2
  record: ^6.2.0
  path_provider: ^2.1.3
  http: ^1.2.2
  url_launcher: ^6.3.0
  path: ^1.9.0
  flutter_webrtc: ^1.4.1
  image_picker: ^1.1.2
  web_socket_channel: ^3.0.1
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/pets/talk/
    - assets/pets/listening/
    - assets/pets/rest/
    - assets/pets/states/
