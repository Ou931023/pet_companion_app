services:
  - type: web
    name: ai-companion-caregiver-web
    runtime: static
    buildCommand: node caregiver_web/build_config_from_env.js
    staticPublishPath: caregiver_web_dist
    autoDeploy: true
    envVars:
      - key: CAREGIVER_WEB_API_BASE_URL
        value: https://ai-companion-api-1gm7.onrender.com/api
      - key: CAREGIVER_WEB_FIREBASE_API_KEY
        sync: false
      - key: CAREGIVER_WEB_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: CAREGIVER_WEB_FIREBASE_PROJECT_ID
        sync: false
      - key: CAREGIVER_WEB_FIREBASE_APP_ID
        sync: false
      - key: CAREGIVER_WEB_MARKETPLACE_ENABLED
        value: "true"
      - key: CAREGIVER_WEB_DAILY_CARE_TASKS_ENABLED
        value: "true"
    headers:
      - path: /runtime-config.js
        name: Cache-Control
        value: no-store
      - path: /config.js
        name: Cache-Control
        value: no-store
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
